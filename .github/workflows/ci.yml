name: CI

on:
  push:
    branches: ["main", "v2"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: No unreferenced exports
        # tsc's noUnusedLocals cannot see across modules, so an export that
        # loses its last caller stays compiling and shipping forever. This is
        # how fireHaptic survived being replaced.
        run: npm run lint:exports

      - name: Render the harness in a real browser
        # Catches what neither tsc nor node --test can: templates that parse
        # into the wrong shape, and getConfigElement returning an element that
        # was never defined -- the bug that left v1's editor blank for two
        # years. Fails on any console error.
        run: npm run shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-screenshots
          path: test/harness/shots/
          if-no-files-found: ignore

      - name: Committed bundle is current
        # dist/ is committed so HACS can serve it straight from the repo, which
        # means it can silently drift from src/. This is exactly how v1 ended up
        # shipping a stale, unminified dev build.
        run: |
          git diff --exit-code -- dist/polr-android-tv-remote-card.js \
            || { echo "::error::committed bundle is stale — run 'npm run build' and commit dist/"; exit 1; }
