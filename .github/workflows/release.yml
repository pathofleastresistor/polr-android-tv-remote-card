name: Release

on:
  push:
    # This repo's existing tags are bare versions (0.0.5), not v-prefixed.
    # Accept both so neither convention silently fails to publish.
    tags: ["v[0-9]*", "[0-9]*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Versions agree, and the committed bundle is current
        run: |
          set -euo pipefail
          pkg=$(jq -r .version package.json)
          const=$(grep -oP 'CARD_VERSION = "\K[^"]+' src/polr-android-tv-remote-card.ts)

          echo "package.json  $pkg"
          echo "CARD_VERSION  $const"

          [[ "$const" == "$pkg" ]] \
            || { echo "::error::CARD_VERSION ($const) does not match package.json ($pkg)"; exit 1; }

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            [[ "${GITHUB_REF_NAME#v}" == "$pkg" ]] \
              || { echo "::error::tag ${GITHUB_REF_NAME} does not match version $pkg"; exit 1; }
          fi

          npm run build
          git diff --exit-code -- dist/polr-android-tv-remote-card.js \
            || { echo "::error::committed bundle is stale — run 'npm run build' and commit dist/"; exit 1; }

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: dist/polr-android-tv-remote-card.js
          generate_release_notes: true
          # HACS hides GitHub pre-releases unless a user opts into betas, and it
          # keys off this flag, not the tag name. Any tag with a pre-release
          # suffix (2.0.0-beta.1) must therefore be marked, or every existing
          # installation is offered it as a normal update.
          prerelease: ${{ contains(github.ref_name, '-') }}
